<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Earthquake Map - Live Seismic Activity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <!-- Map Container -->
      <div id="map"></div>
      
      <!-- Filter Panel -->
      <div id="filter-panel" class="glass-panel absolute top-4 left-4 z-[1000] rounded-2xl p-6 min-w-[300px]">
        <!-- Header -->
        <div class="flex items-center gap-4 mb-5 pb-4 border-b border-white/10">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-500 to-orange-500 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </div>
          <div>
            <h1 class="text-lg font-semibold text-white">Earthquake Map</h1>
            <p class="text-xs text-gray-400">Live seismic activity</p>
          </div>
        </div>

        <!-- Filters -->
        <div class="space-y-4">
          <!-- Magnitude Filter -->
          <div>
            <label for="magnitude-filter" class="block text-xs font-medium text-gray-400 mb-1.5">Magnitude</label>
            <select id="magnitude-filter" class="custom-select w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-orange-500/50 focus:ring-1 focus:ring-orange-500/50 transition-all cursor-pointer hover:bg-white/10">
              <option value="all">All Earthquakes</option>
              <option value="1.0">M1.0+ Minor</option>
              <option value="2.5" selected>M2.5+ Light</option>
              <option value="4.5">M4.5+ Moderate</option>
              <option value="significant">Significant Only</option>
            </select>
          </div>

          <!-- Time Period Filter -->
          <div>
            <label for="time-filter" class="block text-xs font-medium text-gray-400 mb-1.5">Time Period</label>
            <select id="time-filter" class="custom-select w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-orange-500/50 focus:ring-1 focus:ring-orange-500/50 transition-all cursor-pointer hover:bg-white/10">
              <option value="hour">Past Hour</option>
              <option value="day" selected>Past Day</option>
              <option value="week">Past 7 Days</option>
              <option value="month">Past 30 Days</option>
            </select>
          </div>
        </div>

        <!-- Stats Bar -->
        <div class="mt-4 pt-4 border-t border-white/10">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span id="earthquake-count" class="inline-flex items-center justify-center px-2.5 py-1 rounded-full text-xs font-semibold bg-orange-500/20 text-orange-400">0</span>
              <span class="text-xs text-gray-400">earthquakes</span>
            </div>
            <div id="refresh-indicator" class="flex items-center gap-1.5 text-xs text-gray-500">
              <svg id="refresh-icon" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
              <span id="last-updated">--</span>
            </div>
          </div>
        </div>

        <!-- Legend -->
        <div class="mt-4 pt-4 border-t border-white/10">
          <p class="text-xs font-medium text-gray-400 mb-2">Magnitude Scale</p>
          <div class="flex items-center gap-1">
            <div class="flex-1 h-2 rounded-full bg-gradient-to-r from-green-500 via-yellow-500 via-orange-500 to-red-600"></div>
          </div>
          <div class="flex justify-between mt-1">
            <span class="text-[10px] text-gray-500">1.0</span>
            <span class="text-[10px] text-gray-500">3.0</span>
            <span class="text-[10px] text-gray-500">5.0</span>
            <span class="text-[10px] text-gray-500">7.0+</span>
          </div>
        </div>
      </div>

      <!-- Loading Overlay -->
      <div id="loading-overlay" class="absolute inset-0 z-[2000] bg-black/80 flex items-center justify-center hidden">
        <div class="flex flex-col items-center gap-4">
          <div class="w-12 h-12 border-4 border-orange-500/30 border-t-orange-500 rounded-full animate-spin"></div>
          <p class="text-sm text-gray-400">Loading earthquake data...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
