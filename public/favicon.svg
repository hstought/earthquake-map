<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0a0a0a; }
        .circle { fill: #1a5f7a; }
        .wave { stroke: #fb923c; }
      }
      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .circle { fill: #0ea5e9; }
        .wave { stroke: #f97316; }
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect class="bg" width="100" height="100" rx="20"/>
  
  <!-- Outer circle -->
  <circle class="circle" cx="50" cy="50" r="35" fill="none" stroke="currentColor" stroke-width="2" opacity="0.3"/>
  
  <!-- Seismic wave -->
  <path class="wave" d="M 20 50 Q 28 35, 36 50 T 52 50 T 68 50 T 84 50" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Center dot -->
  <circle class="circle" cx="50" cy="50" r="4" fill="currentColor"/>
</svg>
